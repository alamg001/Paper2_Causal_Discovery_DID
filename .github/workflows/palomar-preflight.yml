name: Palomar full mechanical preflight

on:
  workflow_dispatch:
    inputs:
      confirm_responsible_maintainer:
        description: I confirm that I am a responsible author or maintainer of this formalization
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  confirm-relationship:
    runs-on: ubuntu-latest
    steps:
      - name: Require the operator's explicit relationship confirmation
        env:
          CONFIRMED_RELATIONSHIP: ${{ inputs.confirm_responsible_maintainer }}
        run: |
          if [ "$CONFIRMED_RELATIONSHIP" != "true" ]; then
            echo 'Confirm the truthful author/maintainer relationship before running this preflight.' >&2
            exit 1
          fi
  palomar-preflight:
    needs: confirm-relationship
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@14aa8d6b3c2f14a8540605e37144560b9a00e7e7
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.sha }}
      pipeline_commit: 14aa8d6b3c2f14a8540605e37144560b9a00e7e7
      request_id: preflight001
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"comparator.json","authorization_relationship":"I am a responsible author or maintainer"}'

# Manual predictive verification only: no intake, submission, or registration.
# Intended layout: this Lean project is the public repository root.
# Reference and pipeline_commit MUST remain the same full upstream SHA.
